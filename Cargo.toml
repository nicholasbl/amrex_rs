[package]
name = "amrex_rs"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glam = "0.33"
memmap2 = "0.9"
meshopt = "0.6"
rayon = "1"
rkyv = { version = "0.8", features = [
    "bytecheck",
    "pointer_width_64",
    "std",
    "little_endian",
    "alloc",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
